<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f3ed" />
    <title>The Iliad · A reading room</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23f5f3ed'/%3E%3Ctext x='32' y='47' text-anchor='middle' font-size='48' fill='%237c432e'%3EΙ%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header class="masthead">
      <div class="brand"><span class="brand-mark" aria-hidden="true">Ι</span><div><span class="book-title">The Iliad</span><span class="byline">HOMER</span></div></div>
      <div class="pane-controls"><button id="commentary-toggle" class="translation-toggle" aria-expanded="false" aria-controls="commentary"><span>Show notes</span></button>
      <button id="translation-toggle" class="translation-toggle" aria-expanded="false" aria-controls="translation"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="13" rx="2"/><path d="M11 4v12"/></svg><span>Show English</span></button></div>
    </header>
    <main>
      <div class="chapter-heading"><label class="eyebrow" for="book-select">READING <select id="book-select" aria-label="Book" disabled></select></label><h1 id="chapter-title">The Iliad</h1><span class="sample-label">Homer · Loeb Classical Library</span></div>
      <div id="reading-error" class="reading-error" role="alert" hidden><span id="error-message"></span> <button id="retry">Try again</button></div>
      <div class="reading-layout" id="reading-layout">
        <aside id="commentary" class="commentary" aria-labelledby="commentary-heading" hidden>
          <div class="page-heading"><h2 id="commentary-heading">COMMENTARY</h2><button class="close-button" id="close-commentary" aria-label="Hide notes">×</button></div>
          <span id="commentary-range" class="translation-note"></span>
          <div id="commentary-text" class="commentary-text" role="region" aria-label="Lexical and grammatical notes" tabindex="0"></div>
        </aside>
        <article class="greek-page" aria-labelledby="greek-heading">
          <div class="page-heading"><h2 id="greek-heading">GREEK</h2><span class="line-range" id="greek-range"></span></div>
          <div class="verses" id="greek-text" lang="grc"></div>
          <div class="page-ornament" aria-hidden="true">✦</div>
        </article>
        <aside id="translation" class="translation" aria-labelledby="english-heading" hidden>
          <div class="page-heading"><h2 id="english-heading">ENGLISH</h2><button class="close-button" id="close-translation" aria-label="Hide English">×</button></div>
          <span class="translation-note">A. T. Murray <span aria-hidden="true">/</span> <span id="english-range"></span></span>
          <div id="english-text" class="english-text"></div>
          <p class="edition-note">English follows the facing page of the Loeb edition.</p>
        </aside>
      </div>
      <nav class="pagination" aria-label="Page navigation">
        <button id="previous" disabled class="page-button" aria-label="Previous page"><span aria-hidden="true">←</span> Previous</button>
        <div class="page-position"><span id="page-status" role="status" aria-live="polite"></span><div class="progress-track" aria-hidden="true"><div id="progress-fill"></div></div></div>
        <button id="next" disabled class="page-button" aria-label="Next page">Next <span aria-hidden="true">→</span></button>
      </nav>
      <footer><a id="source-link" target="_blank" rel="noopener noreferrer" hidden>View original pages ↗</a><span class="keyboard-hint">Use <kbd>←</kbd> <kbd>→</kbd> to turn the page</span></footer>
    </main>
  </body>
</html>
